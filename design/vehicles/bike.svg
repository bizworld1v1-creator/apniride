<svg xmlns="http://www.w3.org/2000/svg" width="48" height="96" viewBox="0 0 48 96">
  <!-- Top-down motorbike with rider, front pointing up (north). 24 x 48 dp marker. -->
  <defs>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#991b1b"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="tyre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.5" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="helmet" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </radialGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#3b5bcc"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-15%" width="180%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- tyres -->
    <rect x="20.5" y="3" width="7" height="22" rx="3.5" fill="url(#tyre)"/>
    <rect x="19.5" y="66" width="9" height="26" rx="4.5" fill="url(#tyre)"/>
    <!-- headlight + fork -->
    <rect x="19" y="23" width="10" height="7" rx="3.5" fill="#374151"/>
    <ellipse cx="24" cy="23.5" rx="3.6" ry="2.2" fill="#fff9d6" stroke="#d8cf9a" stroke-width="0.5"/>
    <!-- handlebar with grips and mirrors -->
    <rect x="9" y="31" width="30" height="3" rx="1.5" fill="#374151"/>
    <rect x="7" y="30.3" width="5.5" height="4.4" rx="2.2" fill="#111827"/>
    <rect x="35.5" y="30.3" width="5.5" height="4.4" rx="2.2" fill="#111827"/>
    <circle cx="11.5" cy="28" r="1.8" fill="#9ca3af"/>
    <circle cx="36.5" cy="28" r="1.8" fill="#9ca3af"/>
    <!-- tank -->
    <ellipse cx="24" cy="42" rx="7.5" ry="10" fill="url(#tank)"/>
    <ellipse cx="22" cy="39" rx="2.2" ry="4" fill="#ffffff" opacity="0.3"/>
    <!-- seat + rear light -->
    <rect x="18.5" y="53" width="11" height="17" rx="5" fill="#111827"/>
    <rect x="20.5" y="88" width="7" height="2.6" rx="1.3" fill="#dc2626"/>
    <!-- rider: forearms to the grips, shoulders -->
    <path d="M15.5 54 L10.5 34" stroke="#2a4aa8" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M32.5 54 L37.5 34" stroke="#2a4aa8" stroke-width="3.6" stroke-linecap="round"/>
    <ellipse cx="24" cy="57" rx="11.5" ry="6.5" fill="url(#jacket)"/>
  </g>
  <!-- helmet with visor -->
  <circle cx="24" cy="54" r="7.5" fill="url(#helmet)" stroke="#78350f" stroke-width="0.6"/>
  <path d="M19.3 50.6 Q24 46.8 28.7 50.6" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
</svg>
