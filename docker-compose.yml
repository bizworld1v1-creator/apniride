# Local development services for ApniRide.
# Start: pnpm db:up   Stop: pnpm db:down
services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: apniride-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apniride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apniride_dev}
      POSTGRES_DB: ${POSTGRES_DB:-apniride}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: apniride-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
