<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApniRide – Driver mode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>

a{color:#1E40AF}a:hover{color:#17338C}
@keyframes ring{from{stroke-dashoffset:302}to{stroke-dashoffset:96}}
@keyframes wave{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@keyframes slideup{0%{transform:translateY(110%)}70%{transform:translateY(-10px)}100%{transform:none}}
@keyframes count{from{width:100%}to{width:0}}
@keyframes pop{0%{opacity:0;transform:scale(.8)}70%{opacity:1;transform:scale(1.05)}100%{transform:none}}
.ring{stroke-dasharray:302;animation:ring 1.8s cubic-bezier(.2,.9,.3,1) .3s both}
.wave{position:absolute;inset:0;border-radius:50%;border:3px solid #1FC79A;animation:wave 2.2s ease-out infinite}
.slideup{animation:slideup .9s cubic-bezier(.2,.9,.3,1.1) .8s both}
.count{animation:count 15s linear 1.6s both}
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>
html,body{min-height:100%}
body{margin:0;background:#DDE3EF;display:flex;justify-content:center;align-items:center;padding:24px;box-sizing:border-box}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(20,19,43,.25),0 0 0 10px #14132B;flex:none}
</style>
</head>
<body>
<div class="phone"><div style="width:390px;height:844px;background:#F2F5FC;color:#14132B;font-family:'Plus Jakarta Sans',sans-serif;position:relative;overflow:hidden;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div><div style="font-size:13px;color:#5B5A72">Driver mode</div><div style="white-space:nowrap;font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.5px">Ready, Bilal?</div></div>
    <a href="splash.html" style="height:40px;padding:0 14px;border-radius:20px;background:#FFFFFF;color:#14132B;font-weight:600;font-size:13px;text-decoration:none;display:flex;align-items:center">Rider mode</a>
  </div>

  <div class="pop" style="border-radius:32px;background:#FFFFFF;padding:20px;display:flex;align-items:center;gap:18px">
    <div style="position:relative;width:110px;height:110px">
      <svg width="110" height="110" viewBox="0 0 110 110" aria-hidden="true" style="transform:rotate(-90deg)"><circle cx="55" cy="55" r="48" fill="none" stroke="#EBEFF7" stroke-width="12"/><circle class="ring" cx="55" cy="55" r="48" fill="none" stroke="#1E40AF" stroke-width="12" stroke-linecap="round"/></svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-family:'Bricolage Grotesque',sans-serif;font-size:24px">68%</b><span style="font-size:11px;color:#5B5A72">daily goal</span></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div><div style="font-size:12px;color:#5B5A72">Earned today</div><b style="font-family:'Bricolage Grotesque',sans-serif;font-size:28px;letter-spacing:-1px">Rs 6,850</b></div>
      <div style="display:flex;gap:8px"><span style="height:28px;padding:0 10px;border-radius:14px;background:#F2F5FC;font-size:12px;font-weight:600;display:flex;align-items:center">12 trips</span><span style="height:28px;padding:0 10px;border-radius:14px;background:#F2F5FC;font-size:12px;font-weight:600;display:flex;align-items:center">★ 4.9</span></div>
    </div>
  </div>

  <div class="pop" style="animation-delay:.15s;border-radius:32px;background:#14132B;color:#FFFFFF;padding:18px 20px;display:flex;align-items:center;gap:16px">
    <div style="position:relative;width:64px;height:64px"><div class="wave"></div><div class="wave" style="animation-delay:1.1s"></div><div style="position:absolute;inset:6px;border-radius:50%;background:#1FC79A;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14132B" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 7.5a8 8 0 1011.4 0"/></svg></div></div>
    <div style="flex:1"><b style="font-size:17px">You’re online</b><div style="font-size:13px;opacity:.8">High demand near DHA</div></div>
  </div>

  <div style="flex:1"></div>

  <div class="slideup" style="border-radius:34px;background:#FFFFFF;padding:20px;box-shadow:0 -10px 40px rgba(30,64,175,.18);border:2.5px solid #1E40AF">
    <div style="height:6px;border-radius:3px;background:#EBEFF7;overflow:hidden"><div class="count" style="height:100%;background:#FFC83D;border-radius:3px"></div></div>
    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:flex-start">
      <div><span style="height:26px;padding:0 10px;border-radius:13px;background:#E3EAFB;color:#1E40AF;font-size:12px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap">New request · 1.2 km away</span>
        <div style="margin-top:8px;font-weight:700;font-size:16px">Hira S. <span style="font-weight:600;font-size:13px;color:#5B5A72">★ 4.9</span></div></div>
      <div style="text-align:right"><div style="font-size:12px;color:#5B5A72">Rider offers</div><b style="font-family:'Bricolage Grotesque',sans-serif;font-size:30px;letter-spacing:-1px;color:#1E40AF;white-space:nowrap">Rs 1,200</b></div>
    </div>
    <div style="margin-top:12px;border-radius:22px;background:#F2F5FC;padding:12px 14px;display:flex;gap:12px;font-size:14px;font-weight:600">
      <svg width="12" height="48" viewBox="0 0 12 48" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="#1E40AF"/><path d="M6 13v22" stroke="#B7C8EE" stroke-width="2.5" stroke-dasharray="3 4"/><rect x="1" y="37" width="10" height="10" rx="3" fill="#FF8A5B"/></svg>
      <div style="display:flex;flex-direction:column;justify-content:space-between"><span>DHA Phase 5</span><span>Allama Iqbal Airport · 18 km · 35 min</span></div>
    </div>
    <div style="margin-top:12px;font-size:12px;font-weight:600;color:#5B5A72">Counter‑offer</div>
    <div style="margin-top:6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <button style="height:44px;border-radius:22px;border:2px solid #DDE3EF;background:#FFFFFF;font:700 14px 'Plus Jakarta Sans',sans-serif;color:#14132B">Rs 1,300</button>
      <button style="height:44px;border-radius:22px;border:2px solid #DDE3EF;background:#FFFFFF;font:700 14px 'Plus Jakarta Sans',sans-serif;color:#14132B">Rs 1,400</button>
      <button style="height:44px;border-radius:22px;border:2px solid #DDE3EF;background:#FFFFFF;font:700 14px 'Plus Jakarta Sans',sans-serif;color:#14132B">Rs 1,500</button>
    </div>
    <button style="margin-top:12px;width:100%;height:58px;border-radius:29px;border:none;background:#1E40AF;color:#FFFFFF;font:700 17px 'Plus Jakarta Sans',sans-serif">Accept for Rs 1,200</button>
  </div>
</div>
</div>
</body>
</html>
