<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApniRide – Driver offers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
html,body{min-height:100%}
body{margin:0;background:#DDE3EF;display:flex;justify-content:center;align-items:center;padding:24px;box-sizing:border-box}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(20,19,43,.25),0 0 0 10px #14132B;flex:none}
a{color:#1E40AF}
@keyframes hop{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes deal{0%{opacity:0;transform:translateY(80px) rotate(6deg) scale(.9)}70%{opacity:1;transform:translateY(-6px) rotate(-1deg)}100%{transform:none}}
@keyframes timer{from{stroke-dashoffset:0}to{stroke-dashoffset:151}}
@keyframes wave{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.hop{display:inline-block;width:10px;height:10px;border-radius:50%;animation:hop 1.1s ease-in-out infinite}
.deal{animation:deal .7s cubic-bezier(.2,.9,.3,1.25) both}
.timer{stroke-dasharray:151;animation:timer 20s linear both}
.wave{position:absolute;inset:0;border-radius:50%;background:#FFC83D;animation:wave 2s ease-out infinite}
.dot{height:8px;border-radius:4px;transition:all .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="phone">
<div style="width:390px;height:844px;background:#F2F5FC;color:#14132B;font-family:'Plus Jakarta Sans',sans-serif;padding:20px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="fare.html" aria-label="Back" style="width:46px;height:46px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#14132B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="height:40px;padding:0 16px;border-radius:20px;background:#FFFFFF;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600">Your offer <b style="font-family:'Bricolage Grotesque',sans-serif;font-size:18px;color:#1E40AF">Rs 450</b></div>
  </div>

  <div style="margin-top:22px;display:flex;align-items:center;gap:14px">
    <div style="position:relative;width:56px;height:56px"><div class="wave"></div><div class="wave" style="animation-delay:1s"></div><div style="position:absolute;inset:8px;border-radius:50%;background:#FFC83D;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 30 18" aria-hidden="true"><path d="M3 12l3-7h16l4 7v4H3z" fill="#14132B"/></svg></div></div>
    <div><h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.5px"><span id="count">3</span> offers in!</h1>
    <div style="font-size:14px;color:#5B5A72;display:flex;align-items:center;gap:6px">More coming <span class="hop" style="background:#1E40AF"></span><span class="hop" style="background:#FFC83D;animation-delay:.15s"></span><span class="hop" style="background:#1FC79A;animation-delay:.3s"></span></div></div>
  </div>

  <div style="margin-top:26px;position:relative;height:430px">
    <div aria-hidden="true" style="position:absolute;left:28px;right:28px;top:0;height:400px;border-radius:34px;background:#D6E0F7;transform:translateY(-4px)"></div>
    <div aria-hidden="true" style="position:absolute;left:14px;right:14px;top:10px;height:400px;border-radius:34px;background:#B7C8EE"></div>
    <div id="card" class="deal" style="position:absolute;left:0;right:0;top:22px;height:400px;border-radius:34px;background:#FFFFFF;padding:22px;box-sizing:border-box;display:flex;flex-direction:column;box-shadow:0 16px 40px rgba(30,64,175,.15)">
      <div style="display:flex;align-items:center;gap:14px">
        <div id="avatar" style="width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px"></div>
        <div style="flex:1"><div id="name" style="font-size:19px;font-weight:700"></div><div id="meta" style="font-size:13px;color:#5B5A72"></div></div>
        <div style="position:relative;width:56px;height:56px">
          <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true" style="transform:rotate(-90deg)"><circle cx="28" cy="28" r="24" fill="none" stroke="#EBEFF7" stroke-width="5"/><circle id="timer" class="timer" cx="28" cy="28" r="24" fill="none" stroke="#1E40AF" stroke-width="5" stroke-linecap="round"/></svg>
          <span id="secs" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">20s</span>
        </div>
      </div>
      <div style="margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div style="border-radius:20px;background:#F2F5FC;padding:12px 14px"><div style="font-size:12px;color:#5B5A72">Car</div><b id="car" style="font-size:14px"></b></div>
        <div style="border-radius:20px;background:#F2F5FC;padding:12px 14px"><div style="font-size:12px;color:#5B5A72">Arrives in</div><b id="eta" style="font-size:14px"></b></div>
      </div>
      <div style="margin-top:16px;border-radius:24px;background:#FFC83D;padding:16px 18px;display:flex;justify-content:space-between;align-items:center">
        <span id="note" style="font-weight:600"></span><b id="price" style="font-family:'Bricolage Grotesque',sans-serif;font-size:38px;letter-spacing:-1px"></b>
      </div>
      <div style="flex:1"></div>
      <div style="display:flex;gap:10px">
        <button id="skip" aria-label="Skip this offer" style="width:62px;height:62px;border-radius:50%;border:2px solid #DDE3EF;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14132B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <a id="accept" href="trip.html" style="flex:1;height:62px;border-radius:31px;background:#1E40AF;color:#FFFFFF;font-weight:700;font-size:17px;text-decoration:none;display:flex;align-items:center;justify-content:center"></a>
      </div>
    </div>
  </div>
  <div id="dots" style="margin-top:10px;display:flex;justify-content:center;gap:6px"></div>
  <div style="flex:1"></div>
  <button style="height:52px;border-radius:26px;border:none;background:transparent;color:#5B5A72;font:600 15px 'Plus Jakarta Sans',sans-serif">Cancel request</button>
</div>
</div>
<script>
(function () {
  var offers = [
    { initials: 'BA', name: 'Bilal Ahmed', first: 'Bilal', rating: '4.9', trips: '2,340', car: 'Toyota Corolla', eta: '2 min', price: 450, note: 'Accepted your price', tint: '#FFC83D' },
    { initials: 'AM', name: 'Ayesha Malik', first: 'Ayesha', rating: '4.8', trips: '1,120', car: 'Honda City', eta: '4 min', price: 480, note: 'Counter-offer', tint: '#C9F0DF' },
    { initials: 'UT', name: 'Usman Tariq', first: 'Usman', rating: '4.7', trips: '860', car: 'Suzuki Cultus', eta: '6 min', price: 430, note: 'Lower than yours', tint: '#E3EAFB' }
  ];
  var i = 0, secs = 20, tick;
  var $ = function (id) { return document.getElementById(id); };
  document.getElementById('count').textContent = offers.length;

  function restart(el, cls) { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
  function render() {
    var o = offers[i];
    $('avatar').textContent = o.initials; $('avatar').style.background = o.tint;
    $('name').textContent = o.name;
    $('meta').textContent = '★ ' + o.rating + ' · ' + o.trips + ' trips';
    $('car').textContent = o.car; $('eta').textContent = o.eta;
    $('note').textContent = o.note; $('price').textContent = 'Rs ' + o.price;
    $('accept').textContent = 'Ride with ' + o.first;
    $('dots').innerHTML = offers.map(function (_, k) {
      return '<span class="dot" style="width:' + (k === i ? 24 : 8) + 'px;background:' + (k === i ? '#1E40AF' : '#C5CCDB') + '"></span>';
    }).join('');
    restart($('card'), 'deal'); restart($('timer'), 'timer');
    secs = 20; $('secs').textContent = secs + 's';
    clearInterval(tick);
    tick = setInterval(function () {
      secs -= 1; $('secs').textContent = Math.max(secs, 0) + 's';
      if (secs <= 0) next(); // offer expires -> show the next one
    }, 1000);
  }
  function next() { i = (i + 1) % offers.length; render(); }
  $('skip').addEventListener('click', next);
  render();
})();
</script>
</body>
</html>
