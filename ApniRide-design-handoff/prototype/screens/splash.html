<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApniRide – Splash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>

a{color:#1E40AF}a:hover{color:#17338C}
@keyframes sunrise{from{transform:translateY(160px) scale(.7)}to{transform:none}}
@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes roll{0%{transform:translateX(-140px)}100%{transform:translateX(420px)}}
@keyframes wheel{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes bounce{0%{opacity:0;transform:translateY(40px) scale(.9)}60%{opacity:1;transform:translateY(-8px) scale(1.02)}100%{transform:none}}
@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes lane{to{transform:translateX(-60px)}}
.sun{animation:sunrise 1.4s cubic-bezier(.2,.9,.3,1.2) both}
.rays{animation:spinr 30s linear infinite}
.roll{animation:roll 6s linear infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:wheel .6s linear infinite}
.bob{animation:bob .4s ease-in-out infinite}
.bounce{animation:bounce .9s cubic-bezier(.2,.9,.3,1.3) both}
.cloud{animation:cloud 8s ease-in-out infinite alternate}
.lane{animation:lane .8s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>
html,body{min-height:100%}
body{margin:0;background:#DDE3EF;display:flex;justify-content:center;align-items:center;padding:24px;box-sizing:border-box}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(20,19,43,.25),0 0 0 10px #14132B;flex:none}
</style>
</head>
<body>
<div class="phone"><div style="width:390px;height:844px;background:#1E40AF;color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:0 24px 36px;box-sizing:border-box">
  <div aria-hidden="true" class="sun" style="position:absolute;left:95px;top:150px;width:200px;height:200px">
    <svg class="rays" width="200" height="200" viewBox="0 0 200 200" style="position:absolute;inset:0"><g stroke="#FFC83D" stroke-width="6" stroke-linecap="round"><path d="M100 4v22M100 174v22M4 100h22M174 100h22M32 32l16 16M152 152l16 16M32 168l16-16M152 48l16-16"/></g></svg>
    <div style="position:absolute;inset:40px;border-radius:50%;background:#FFC83D"></div>
  </div>
  <svg class="cloud" aria-hidden="true" width="120" height="44" viewBox="0 0 120 44" style="position:absolute;left:250px;top:120px"><path d="M20 40h80a18 18 0 000-36 26 26 0 00-48 4A18 18 0 0020 40z" fill="#FFFFFF" opacity=".9"/></svg>
  <svg class="cloud" aria-hidden="true" width="90" height="34" viewBox="0 0 120 44" style="position:absolute;left:10px;top:290px;animation-delay:-3s"><path d="M20 40h80a18 18 0 000-36 26 26 0 00-48 4A18 18 0 0020 40z" fill="#FFFFFF" opacity=".7"/></svg>

  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:400px;height:70px;background:#17338C;overflow:hidden">
    <div class="lane" style="position:absolute;top:33px;left:0;width:500px;height:4px;background:repeating-linear-gradient(90deg,#FFFFFF 0 30px,transparent 30px 60px);opacity:.5"></div>
  </div>
  <div class="roll" aria-hidden="true" style="position:absolute;top:356px;left:0">
    <svg class="bob" width="110" height="60" viewBox="0 0 110 60"><path d="M8 40V30c0-4 3-6 7-7l14-3 14-12c3-2 6-3 10-3h20c4 0 7 2 9 5l10 14c6 1 10 4 10 9v7z" fill="#FFC83D"/><path d="M47 12h16v10H36z M67 12h12l7 10H67z" fill="#14132B" opacity=".75"/><g class="wheel"><circle cx="28" cy="44" r="10" fill="#14132B"/><circle cx="28" cy="44" r="4" fill="#FFFFFF"/><rect x="27" y="35" width="2" height="18" fill="#FFFFFF"/></g><g class="wheel"><circle cx="84" cy="44" r="10" fill="#14132B"/><circle cx="84" cy="44" r="4" fill="#FFFFFF"/><rect x="83" y="35" width="2" height="18" fill="#FFFFFF"/></g></svg>
  </div>

  <div style="flex:1"></div>
  <h1 class="bounce" style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:64px;font-weight:800;letter-spacing:-2.5px;line-height:.95;animation-delay:.6s">ApniRide<span style="color:#FFC83D">.</span></h1>
  <p class="bounce" style="margin:14px 0 0;font-size:20px;line-height:1.4;font-weight:500;animation-delay:.75s">Fair rides, on <span style="background:#FFC83D;color:#14132B;padding:0 8px;border-radius:8px;font-weight:700">your</span> terms.<br>You set the price — drivers say yes.</p>
  <a href="login.html" class="bounce" style="animation-delay:.9s;margin-top:32px;height:62px;border-radius:31px;background:#FFFFFF;color:#14132B;font-weight:700;font-size:17px;text-decoration:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 28px">Let’s ride
    <span style="width:48px;height:48px;border-radius:50%;background:#FFC83D;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14132B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  <a href="driver.html" class="bounce" style="animation-delay:1s;margin-top:14px;text-align:center;color:#FFFFFF;font-weight:600;font-size:15px">Become a driver</a>
</div>
</div>
</body>
</html>
