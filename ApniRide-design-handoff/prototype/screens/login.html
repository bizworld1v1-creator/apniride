<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApniRide – Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>

a{color:#1E40AF}a:hover{color:#17338C}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes bubble{0%{opacity:0;transform:scale(.3) translateY(20px)}60%{opacity:1;transform:scale(1.1)}100%{transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fill{0%{transform:scale(.4);background:#FFFFFF}70%{transform:scale(1.12)}100%{transform:none}}
@keyframes blink{50%{opacity:0}}
.float{animation:float 3.5s ease-in-out infinite}
.bubble{animation:bubble .7s cubic-bezier(.2,.9,.3,1.4) .5s both}
.up{animation:up .8s cubic-bezier(.2,.9,.25,1.05) both}
.fill{animation:fill .5s cubic-bezier(.2,.9,.3,1.5) both}
.caret{display:inline-block;width:2px;height:26px;background:#1E40AF;animation:blink 1s steps(1) infinite}
.key:active{transform:scale(.9);background:#E3EAFB}
input:focus{outline:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>
html,body{min-height:100%}
body{margin:0;background:#DDE3EF;display:flex;justify-content:center;align-items:center;padding:24px;box-sizing:border-box}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(20,19,43,.25),0 0 0 10px #14132B;flex:none}
</style>
</head>
<body>
<div class="phone"><div style="width:390px;height:844px;background:#1E40AF;color:#14132B;font-family:'Plus Jakarta Sans',sans-serif;position:relative;overflow:hidden">
  <a href="splash.html" aria-label="Back" style="position:absolute;top:20px;left:20px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
  <div class="float" aria-hidden="true" style="position:absolute;left:140px;top:56px;width:96px;height:150px;border-radius:22px;background:#FFFFFF;border:5px solid #14132B;box-sizing:border-box">
    <div style="margin:12px auto 0;width:30px;height:5px;border-radius:3px;background:#14132B"></div>
    <div style="margin:18px 12px 0;height:8px;border-radius:4px;background:#E3EAFB"></div>
    <div style="margin:8px 12px 0 26px;height:8px;border-radius:4px;background:#E3EAFB"></div>
  </div>
  <div class="bubble" aria-hidden="true" style="position:absolute;left:214px;top:48px;height:44px;padding:0 14px;border-radius:22px 22px 22px 6px;background:#FFC83D;display:flex;align-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;letter-spacing:3px">4 7 2 •</div>

  <div class="up" style="position:absolute;left:0;right:0;bottom:0;height:610px;background:#FFFFFF;border-radius:40px 40px 0 0;padding:28px 24px 24px;box-sizing:border-box;display:flex;flex-direction:column">
    <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:32px;font-weight:800;letter-spacing:-1px">Hey there!</h1>
    <p style="margin:6px 0 0;color:#5B5A72;font-size:15px">Log in with your phone — takes 10 seconds.</p>
    <label for="bphone" style="margin-top:20px;font-size:13px;font-weight:600;color:#5B5A72">Phone number</label>
    <div style="margin-top:6px;height:58px;border-radius:29px;background:#F2F5FC;display:flex;align-items:center;padding:0 6px 0 20px;gap:10px">
      <b>+92</b><span style="width:1px;height:24px;background:#D3DAEA"></span>
      <input id="bphone" type="tel" value="300 1234567" style="flex:1;min-width:0;border:none;background:transparent;font:600 18px 'Plus Jakarta Sans',sans-serif;color:#14132B">
      <span style="width:46px;height:46px;border-radius:50%;background:#1FC79A;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
    </div>
    <div style="margin-top:18px;font-size:13px;font-weight:600;color:#5B5A72">Code sent by SMS</div>
    <div style="margin-top:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
      <div class="fill" style="height:64px;border-radius:50%;width:64px;justify-self:center;background:#1E40AF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;animation-delay:.6s">4</div>
      <div class="fill" style="height:64px;border-radius:50%;width:64px;justify-self:center;background:#1E40AF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;animation-delay:.75s">7</div>
      <div class="fill" style="height:64px;border-radius:50%;width:64px;justify-self:center;background:#1E40AF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;animation-delay:.9s">2</div>
      <div style="height:64px;border-radius:50%;width:64px;justify-self:center;border:2.5px dashed #1E40AF;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><span class="caret"></span></div>
    </div>
    <div style="margin-top:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <button class="key" style="height:42px;border:none;border-radius:14px;background:#F2F5FC;font:700 20px 'Plus Jakarta Sans',sans-serif;color:#14132B;transition:transform .1s">1</button>
      <button class="key" style="height:42px;border:none;border-radius:14px;background:#F2F5FC;font:700 20px 'Plus Jakarta Sans',sans-serif;color:#14132B;transition:transform .1s">2</button>
      <button class="key" style="height:42px;border:none;border-radius:14px;background:#F2F5FC;font:700 20px 'Plus Jakarta Sans',sans-serif;color:#14132B;transition:transform .1s">3</button>
      <button class="key" style="height:42px;border:none;border-radius:14px;background:#F2F5FC;font:700 20px 'Plus Jakarta Sans',sans-serif;color:#14132B;transition:transform .1s">4</button>
      <button class="key" style="height:42px;border:none;border-radius:14px;background:#F2F5FC;font:700 20px 'Plus Jakarta Sans',sans-serif;color:#14132B;transition:transform .1s">5</button>
      <button class="key" style="height:42px;border:none;border-radius:14px;background:#F2F5FC;font:700 20px 'Plus Jakarta Sans',sans-serif;color:#14132B;transition:transform .1s">6</button>
      <button class="key" style="height:42px;border:none;border-radius:14px;background:#F2F5FC;font:700 20px 'Plus Jakarta Sans',sans-serif;color:#14132B;transition:transform .1s">7</button>
      <button class="key" style="height:42px;border:none;border-radius:14px;background:#F2F5FC;font:700 20px 'Plus Jakarta Sans',sans-serif;color:#14132B;transition:transform .1s">8</button>
      <button class="key" style="height:42px;border:none;border-radius:14px;background:#F2F5FC;font:700 20px 'Plus Jakarta Sans',sans-serif;color:#14132B;transition:transform .1s">9</button>
    </div>
    <div style="flex:1"></div>
    <a href="home.html" style="height:60px;border-radius:30px;background:#1E40AF;color:#FFFFFF;font-weight:700;font-size:17px;text-decoration:none;display:flex;align-items:center;justify-content:center">Continue</a>
  </div>
</div>
</div>
</body>
</html>
